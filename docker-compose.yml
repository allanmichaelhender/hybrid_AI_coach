name: hybrid-hour

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hybrid_coach_db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=hybrid_coach
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: hybrid_coach_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hybrid_coach_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=.
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/hybrid_coach
      - PROJECT_NAME="Hybrid Hour"
      - API_V1_STR=${API_V1_STR}
      - SECRET_KEY=${SECRET_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - db
    restart: unless-stopped
    command: gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://hybrid-hour.ddnsfree.com/api
    container_name: hybrid_coach_frontend
    ports:
      - "5173:5173"
    volumes:
      - frontend_assets:/app/dist:rw
    restart: unless-stopped

  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443" # For HTTPS
    volumes:
      - static_volume:/app/static:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_assets:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:rw # For Certbot certificates
      - /var/www/certbot:/var/www/certbot:rw # For Certbot challenges
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  static_volume:
  frontend_assets:
