name: hybrid-hour

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hybrid_coach_db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=hybrid_coach
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: hybrid_coach_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hybrid_coach_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=.
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/hybrid_coach
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hybrid_coach_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend # Fixed: was /app
      - /app/frontend/node_modules # Fixed: ensures container-side modules are used
    working_dir: /app/frontend # Explicitly set the working directory
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

volumes:
  postgres_data:
